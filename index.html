<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PORTFOLIO CABRERA</title>
    <link rel="stylesheet" href="background.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark barra">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">PORTFOLIO</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="#">Home</a>
                <a class="nav-link" href="#">Description</a>
                <a class="nav-link" href="#">Proyectos</a>
            </div>
        </div>
    </nav>
    <section class="primerRectangulo">
        <div class="texto">
            <h1>Mi Portfolio</h1>
            <p>Hola mundo</p>
            <p>Bienvenido a mi portfolio</p>
        </div>
        <div class="parteDerecha">
            <div class="logoHuergo">
                <img src="images/logo_huergo.png" alt="Logo Huergo">
            </div>
            <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
                </div>
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="images/jdc/glases.png" class="d-block w-100" alt="Juego de los vidrios">
                    </div>
                    <div class="carousel-item">
                        <img src="images/jdc/rope.png" class="d-block w-100" alt="Tira la cuerda">
                    </div>
                    <div class="carousel-item">
                        <img src="images/jdc/bubbles.png" class="d-block w-100" alt="Juego de las canicas">
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Anterior</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Siguiente</span>
                </button>
            </div>
        </div>
    </section>
    <section class="segundoRectangulo">
        <div class="contenido">
            <h2>Mis proyectos</h2>
            <p>Acá voy a mostrar algunos de mis proyectos.</p>
        </div>
    </section>
    <footer>
        <p>CONTACTO: jcabreragradin@alumno.huergo.edu.ar</p>
        <p>IG: @sebatwister</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
